<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manipal RPG</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #00ff00; 
            font-family: 'Courier New', monospace; 
            padding: 20px; 
            display: flex;
            gap: 20px;
        }

        /* Main Game Area */
        .game-container { 
            flex: 3;
            max-width: 900px; 
            border: 3px solid #00ff00; 
            padding: 30px; 
        }

        /* Right Sidebar for Runes */
        .sidebar {
            flex: 1;
            border: 3px solid #00ff44;
            padding: 20px;
            height: fit-content;
        }

        .stats-bar { 
            display: flex; 
            justify-content: space-between; 
            border-bottom: 2px solid #00ff44; 
            padding-bottom: 15px; 
            margin-bottom: 30px; 
            font-size: 1.2rem; 
            font-weight: bold;
        }
        
        .story-text { 
            font-size: 1.6rem; 
            min-height: 225px; 
            margin-bottom: 30px; 
            line-height: 1.6; 
        }
        
        .choices { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
        }
        
        button {
            background: black; 
            color: #00ff00; 
            border: 2px solid #00ff00; 
            padding: 20px; 
            font-family: inherit; 
            cursor: pointer; 
            font-size: 1.3rem; 
            transition: 0.2s;
        }
        button:hover { 
            background: #00ff00; 
            color: black; 
        }
        button:disabled {
            border-color: #555;
            color: #555;
            cursor: not-allowed;
        }

        .rune-item {
            border: 1px solid #eebb00;
            color: #eebb00;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .watermark {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #555f66;
            font-size: 0.9rem;
            font-family: 'Courier New', Courier, monospace; 
            pointer-events: none;
            z-index: 1000;
        }

        h3 { margin-top: 0; color: #eebb00; }

        /* ── Provider Selection Overlay ── */
        #provider-screen {
            position: fixed;
            inset: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            z-index: 999;
        }

        #provider-screen h2 {
            font-size: 1.8rem;
            color: #00ff00;
            letter-spacing: 2px;
        }

        #provider-screen p {
            color: #555f66;
            font-size: 1rem;
        }

        .provider-buttons {
            display: flex;
            gap: 30px;
        }

        .provider-btn {
            background: black;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 25px 40px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            text-align: center;
            min-width: 200px;
        }

        .provider-btn.groq {
            color: #4488ff;
            border-color: #4488ff;
        }

        .provider-btn:hover { background: #00ff00; color: black; }
        .provider-btn.groq:hover { background: #4488ff; color: black; }

        .provider-btn small {
            display: block;
            margin-top: 8px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        #provider-indicator {
            font-size: 0.85rem;
            padding: 2px 8px;
            border: 1px solid #00ff0055;
            color: #00cc00;
        }

        #provider-indicator.groq {
            color: #4488ff;
            border-color: #4488ff55;
        }
    </style>
</head>
<body>

<!-- Provider Selection Overlay -->
<div id="provider-screen">
    <h2>MANIPAL RPG</h2>
    <p>Choose your AI Oracle before the semester begins.</p>
    <div class="provider-buttons">
        <button class="provider-btn" onclick="startGame('gemini')">
            GEMINI
            <small>Google AI · Reliable</small>
        </button>
        <button class="provider-btn groq" onclick="startGame('groq')">
            GROQ ⚡
            <small>Llama 3.3 · Ultra-fast</small>
        </button>
    </div>
    <p>Both are free. Choice affects speed, not story.</p>
</div>

<!-- Game UI (original) -->
<div class="game-container">
    <div class="stats-bar">
        <span id="turn">Turn: 1/50</span>
        <span id="hp">HP: 100/100</span>
        <span id="gold">Gold: 500</span>
        <span id="attack">ATK: 10</span>
        <span id="provider-indicator">GEMINI</span>
    </div>

    <div class="story-text" id="story">
        Welcome to Manipal. The humidity is rising. Choose your Oracle.
    </div>

    <div class="choices" id="choices">
        <!-- Filled after provider selection -->
    </div>
</div>

<div class="sidebar">
    <h3>RUNES COLLECTED</h3>
    <div id="rune-list"></div>
</div>

<script>
    async function startGame(provider) {
        document.getElementById('provider-screen').style.display = 'none';

        const response = await fetch('/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ provider })
        });

        const data = await response.json();

        // Update provider indicator
        const indicator = document.getElementById('provider-indicator');
        indicator.textContent = provider === 'groq' ? 'GROQ ⚡' : 'GEMINI';
        indicator.className = provider === 'groq' ? 'groq' : '';

        updateStats(data.stats);

        document.getElementById('story').innerText = 'Welcome to Manipal. The humidity is rising. Choose your path.';
        const choicesDiv = document.getElementById('choices');
        choicesDiv.innerHTML = '';
        const startBtn = document.createElement('button');
        startBtn.innerText = 'Start Game';
        startBtn.style.gridColumn = 'span 2';
        startBtn.onclick = () => makeChoice('Start Game');
        choicesDiv.appendChild(startBtn);
    }

    function updateStats(stats) {
        try { document.getElementById('hp').innerText = "HP: " + stats.hp + "/" + stats.max_hp; } catch(e) {}
        try { document.getElementById('gold').innerText = "Gold: " + stats.gold; } catch(e) {}
        try { document.getElementById('attack').innerText = "ATK: " + stats.attack; } catch(e) {}
        try { document.getElementById('turn').innerText = "Turn: " + stats.turn + "/50"; } catch(e) {}

        const runeList = document.getElementById('rune-list');
        if (runeList && stats.runes) {
            runeList.innerHTML = "";
            stats.runes.forEach(rune => {
                const rDiv = document.createElement('div');
                rDiv.className = "rune-item";
                rDiv.innerText = rune;
                runeList.appendChild(rDiv);
            });
        }
    }

    async function makeChoice(text) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(b => b.disabled = true);
        document.getElementById('story').innerText = "Thinking...";

        try {
            const response = await fetch('/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ choice: text })
            });
            
            const data = await response.json();
            
            document.getElementById('story').innerText = data.message;

            if(data.stats) updateStats(data.stats);

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = "";

            if (data.stats && (data.stats.is_game_over || data.stats.hp <= 0)) {
                let endMessage = data.stats.hp <= 0 ? "💀 WASTED 💀" : "🏆 GRADUATED! 🏆";
                let color = data.stats.hp <= 0 ? "#ff4444" : "#00ff00";

                const endTitle = document.createElement('h2');
                endTitle.innerText = endMessage;
                endTitle.style.color = color;
                endTitle.style.textAlign = "center";
                endTitle.style.gridColumn = "span 2"; 
                choicesDiv.appendChild(endTitle);

                const restartBtn = document.createElement('button');
                restartBtn.innerText = "RESTART SEMESTER";
                restartBtn.style.gridColumn = "span 2";
                restartBtn.style.borderColor = color;
                restartBtn.style.color = color;
                restartBtn.onclick = () => window.location.reload(); 
                choicesDiv.appendChild(restartBtn);

            } else {
                if(data.options) {
                    data.options.forEach(option => {
                        const btn = document.createElement('button');
                        btn.innerText = option;
                        btn.onclick = () => makeChoice(option);
                        choicesDiv.appendChild(btn);
                    });
                }
            }

        } catch (error) {
            console.error(error);
            document.getElementById('story').innerText = "Connection Failed. Please Refresh.";
        }
    }
</script>

    <div class="watermark">Made by Noddy :)</div>
</body>
</html>
